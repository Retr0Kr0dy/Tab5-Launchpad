
name: Build and release firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Controller and touch regression tests
        run: ./tools/test-controller.sh

  build:
    needs: native-tests
    runs-on: ubuntu-latest

    # Keep synchronized with README.md.
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Package firmware binaries
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"

          mkdir -p dist

          # Individual binaries for advanced flashing.
          cp build/tab5-launchpad.bin dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/

          # Produce a complete flash image using ESP-IDF's
          # generated addresses and flash configuration.
          #
          # flasher_args.json is used internally only.
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          build = Path("build")
          args = json.loads(
              (build / "flasher_args.json").read_text()
          )

          settings = args["flash_settings"]
          flash_files = args["flash_files"]

          command = [
              sys.executable, "-m", "esptool",
              "--chip", "esp32p4",
              "merge-bin",
              "-o", "../dist/Tab5-Launchpad-full.bin",
              "--flash-mode", settings["flash_mode"],
              "--flash-freq", settings["flash_freq"],
              "--flash-size", settings["flash_size"],
          ]

          entries = sorted(
              (
                  (int(offset, 0), filename)
                  for offset, filename in flash_files.items()
              ),
              key=lambda entry: entry[0],
          )

          for offset, filename in entries:
              command.extend([hex(offset), filename])

          print("Merging:", entries, flush=True)
          subprocess.run(command, cwd=build, check=True)

          # Verify that all flash components appear at
          # their intended offsets in the merged image.
          merged = Path(
              "dist/Tab5-Launchpad-full.bin"
          ).read_bytes()

          for offset, filename in entries:
              original = (build / filename).read_bytes()
              actual = merged[
                  offset:offset + len(original)
              ]

              # esptool can rewrite flash header fields
              # when merging. Compare with the exception
              # of those permitted header bytes.
              if actual != original:
                  if offset == 0x2000:
                      assert (
                          actual[:2] == original[:2]
                          and actual[4:] == original[4:]
                      ), f"Bootloader mismatch: {filename}"
                  else:
                      raise RuntimeError(
                          f"Binary mismatch at {hex(offset)}: "
                          f"{filename}"
                      )

          print("Merged firmware verified successfully.")
          PY

          # Only the four firmware binaries and checksum
          # manifest are included in dist/.
          (
            cd dist
            sha256sum \
              Tab5-Launchpad-full.bin \
              tab5-launchpad.bin \
              bootloader.bin \
              partition-table.bin \
              > SHA256SUMS.txt
          )

          echo "=== Release files ==="
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tab5-launchpad-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tab5-Launchpad-full.bin
            dist/tab5-launchpad.bin
            dist/bootloader.bin
            dist/partition-table.bin
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
